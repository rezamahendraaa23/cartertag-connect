name: cartertag_connect
description: "CarterTag Connect: komunikasi lapangan driver dan panitia, online + mesh offline."
publish_to: 'none'
version: 1.3.1+6

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  battery_plus: ^7.1.2
  connectivity_plus: ^7.3.1
  cryptography: ^2.9.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_database: ^13.1.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^23.0.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  just_audio: ^0.10.6
  lucide_icons_flutter: ^4.0.3
  mobile_scanner: ^7.5.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  qr_flutter: ^4.1.0
  record: ^7.2.0
  sembast: ^3.10.1
  sembast_web: ^2.4.7
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  vibration: ^3.2.1
  wakelock_plus: ^1.8.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700

